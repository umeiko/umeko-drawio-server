<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>draw.io 节点</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #14161a; color: #dfe3ea; font: 13px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #1d2027; border-bottom: 1px solid #2c313c; flex: none; flex-wrap: wrap; }
  header b { color: #8ab4f8; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; background: #666; }
  .dot.on { background: #3ddc84; }
  .dot.off { background: #ff5f57; }
  button { background: #2b6cb0; border: 0; color: #fff; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  button:hover { background: #3182ce; }
  button.ghost { background: #3a4150; }
  button.ghost:hover { background: #495163; }
  label { display: flex; align-items: center; gap: 4px; color: #9aa3b2; user-select: none; }
  #msg { margin-left: auto; color: #9aa3b2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
  #msg.err { color: #ff8a80; }
  main { flex: 1; display: flex; min-height: 0; }
  #left { width: 42%; min-width: 0; display: flex; flex-direction: column; }
  #splitter { flex: none; width: 6px; cursor: col-resize; background: #1d2027; border-left: 1px solid #2c313c; }
  #splitter:hover, #splitter.active { background: #2b6cb0; }
  body.dragging { user-select: none; cursor: col-resize; }
  body.collapsed #left, body.collapsed #splitter { display: none; }
  #src { flex: 1; resize: none; border: 0; outline: 0; background: #0f1115; color: #a5d6a7; font: 12px/1.45 "Cascadia Code", Consolas, monospace; padding: 10px; white-space: pre; overflow: auto; }
  #right { flex: 1; min-width: 0; position: relative; display: flex; }
  #expandStrip { display: none; flex: none; width: 20px; background: #1d2027; border-right: 1px solid #2c313c; color: #8ab4f8; cursor: pointer; align-items: center; justify-content: center; font-size: 14px; writing-mode: vertical-rl; letter-spacing: 2px; }
  body.collapsed #expandStrip { display: flex; }
  #expandStrip:hover { background: #2b6cb0; color: #fff; }
  #drawio { flex: 1; min-width: 0; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<header>
  <b>draw.io 节点</b> <span id="nid"></span>
  <span title="实时通道"><span id="wsDot" class="dot off"></span>通道</span>
  <span><span id="edDot" class="dot off"></span>编辑器</span>
  <button id="btnToggleSrc" class="ghost" title="收起/展开左侧源码面板">« 源码</button>
  <button id="btnPull" title="从右侧编辑器取回当前图形 XML 到左侧">更新源码</button>
  <button id="btnPush" class="ghost" title="把左侧源码载入右侧编辑器">应用到编辑器</button>
  <button id="btnCheck" class="ghost" title="对左侧源码做编译检查">检查错误</button>
  <label><input type="checkbox" id="fmt" checked>格式化</label>
  <span id="msg"></span>
</header>
<main id="main">
  <section id="left"><textarea id="src" spellcheck="false"></textarea></section>
  <div id="splitter" title="拖动调整源码区宽度，双击折叠"></div>
  <section id="right">
    <div id="expandStrip" title="展开源码面板">源码 »</div>
    <iframe id="drawio" allow="clipboard-read; clipboard-write"></iframe>
  </section>
</main>
<script>
(function () {
  var EMPTY_XML = '<mxfile host="embed"><diagram name="Page-1"><mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel></diagram></mxfile>';
  // 运行时推导：页面位于 <base>/node/<id>（或静态直出 /node.html?id=<id>）
  var pathMatch = location.pathname.match(/^(.*)\/node\/([^/]+)\/?$/);
  var BASE = pathMatch ? pathMatch[1] : location.pathname.replace(/\/node\.html$/, '');
  var nodeId = pathMatch
    ? decodeURIComponent(pathMatch[2])
    : (new URLSearchParams(location.search).get('id') || '');
  var $ = function (id) { return document.getElementById(id); };
  var iframe = $('drawio'), src = $('src'), msg = $('msg');
  var mainEl = $('main'), leftEl = $('left'), splitter = $('splitter'), expandStrip = $('expandStrip');

  $('nid').textContent = nodeId;
  iframe.src = BASE + '/?embed=1&proto=json&spin=1&analytics=0&picker=0&autosave=1&saveAndExit=0&noExitBtn=1&lang=zh';

  var currentXml = EMPTY_XML;
  var editorReady = false;
  var ws = null;
  var es = null;
  var exportWaiter = null;

  // 通道传输方式：URL ?transport=ws|sse 优先，其次服务端全局配置（/api/config 拉取），默认 auto（WS 优先，连不上自动降级 SSE）
  var FORCE_TRANSPORT = new URLSearchParams(location.search).get('transport');
  var SERVER_TRANSPORT = 'auto';
  var transportMode = FORCE_TRANSPORT || '';
  var usingSse = false;

  function say(t, isErr) { msg.textContent = t; msg.className = isErr ? 'err' : ''; }
  function setDot(el, on) { el.className = 'dot ' + (on ? 'on' : 'off'); }

  // ---------- 源码面板：调宽 + 折叠 ----------

  var MIN_W = 200;

  function applyWidth(px) {
    var max = Math.max(MIN_W, mainEl.clientWidth - 240);
    var w = Math.max(MIN_W, Math.min(px, max));
    leftEl.style.width = w + 'px';
    try { localStorage.setItem('node.leftWidth', String(w)); } catch (e) {}
  }

  function setCollapsed(c) {
    document.body.classList.toggle('collapsed', c);
    $('btnToggleSrc').textContent = c ? '» 源码' : '« 源码';
    try { localStorage.setItem('node.collapsed', c ? '1' : '0'); } catch (e) {}
  }

  splitter.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    splitter.classList.add('active');
    document.body.classList.add('dragging');
    try { splitter.setPointerCapture(e.pointerId); } catch (err) {}
  });
  splitter.addEventListener('pointermove', function (e) {
    if (!splitter.classList.contains('active')) return;
    applyWidth(e.clientX - mainEl.getBoundingClientRect().left);
  });
  function endDrag() {
    splitter.classList.remove('active');
    document.body.classList.remove('dragging');
  }
  splitter.addEventListener('pointerup', endDrag);
  splitter.addEventListener('pointercancel', endDrag);
  splitter.addEventListener('dblclick', function () { setCollapsed(true); });
  $('btnToggleSrc').onclick = function () { setCollapsed(!document.body.classList.contains('collapsed')); };
  expandStrip.onclick = function () { setCollapsed(false); };

  (function restoreLayout() {
    var savedW = parseInt(localStorage.getItem('node.leftWidth') || '', 10);
    if (savedW) leftEl.style.width = savedW + 'px';
    setCollapsed(localStorage.getItem('node.collapsed') === '1');
  })();

  // ---------- XML 展示 ----------

  function pretty(xml) {
    if (!$('fmt').checked) return xml;
    try {
      var s = xml.replace(/>\s+</g, '><').replace(/></g, '>\n<');
      var depth = 0, out = [];
      s.split('\n').forEach(function (line) {
        var t = line.trim();
        if (!t) return;
        var isClose = /^<\//.test(t);
        var selfClose = /\/>$/.test(t);
        var hasCloseTag = /<\/[^>]+>/.test(t);
        var isDecl = /^<[?!]/.test(t);
        if (isClose) depth = Math.max(0, depth - 1);
        out.push(new Array(depth + 1).join('  ') + t);
        if (!isClose && !selfClose && !hasCloseTag && !isDecl) depth++;
      });
      return out.join('\n');
    } catch (e) { return xml; }
  }

  function setSrc(xml) { src.value = pretty(xml); }

  // ---------- 与嵌入编辑器通信（drawio embed 协议） ----------

  function postToEditor(obj) {
    if (editorReady) iframe.contentWindow.postMessage(JSON.stringify(obj), '*');
  }

  function requestExport(cb) {
    if (!editorReady) { cb(currentXml); return; }
    exportWaiter = cb;
    postToEditor({ action: 'export', format: 'xml' });
  }

  // ---------- 与服务器通信（WebSocket / SSE 双通道） ----------

  function handleServerMessage(m) {
    if (m.type === 'setXml') {
      currentXml = m.xml;
      postToEditor({ action: 'load', xml: m.xml });
      setSrc(m.xml);
      say('已接收推送的 XML');
    } else if (m.type === 'getXml') {
      requestExport(function (x) {
        currentXml = x;
        channelSend({ type: 'xml', requestId: m.requestId, xml: x });
        setSrc(x);
      });
    }
  }

  function applyTransport(t) {
    SERVER_TRANSPORT = t === 'ws' || t === 'sse' ? t : 'auto';
    transportMode = FORCE_TRANSPORT || (SERVER_TRANSPORT === 'auto' ? '' : SERVER_TRANSPORT);
    usingSse = transportMode === 'sse';
  }

  function channelSend(o) {
    if (usingSse) {
      fetch(BASE + '/api/nodes/' + encodeURIComponent(nodeId) + '/report', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(o),
      }).catch(function () {});
    } else if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify(o));
    }
  }

  function connectWs() {
    var opened = false;
    // 3 秒内 WS 未连通（如 ALB 不支持 WebSocket）自动降级 SSE；强制 ws 时不降级
    var fbTimer = setTimeout(function () {
      if (!opened && transportMode !== 'ws') {
        usingSse = true;
        try { ws.close(); } catch (e) {}
        connectSse();
      }
    }, 3000);
    ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + BASE + '/ws?node=' + encodeURIComponent(nodeId));
    ws.onopen = function () {
      opened = true;
      clearTimeout(fbTimer);
      setDot($('wsDot'), true);
      $('wsDot').parentNode.title = 'WebSocket 通道';
    };
    ws.onclose = function () {
      setDot($('wsDot'), false);
      clearTimeout(fbTimer);
      if (!opened && transportMode !== 'ws') {
        usingSse = true;
        connectSse();
        return;
      }
      if (!usingSse) setTimeout(connectWs, 1500);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
    ws.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (err) { return; }
      handleServerMessage(m);
    };
  }

  function connectSse() {
    if (es) return;
    es = new EventSource(BASE + '/api/nodes/' + encodeURIComponent(nodeId) + '/events');
    es.onopen = function () {
      setDot($('wsDot'), true);
      $('wsDot').parentNode.title = 'SSE 通道（ALB 兼容模式）';
    };
    es.onerror = function () { setDot($('wsDot'), false); }; // EventSource 自动重连
    es.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (err) { return; }
      handleServerMessage(m);
    };
  }

  function connect() {
    if (usingSse) connectSse(); else connectWs();
  }

  window.addEventListener('message', function (e) {
    if (e.source !== iframe.contentWindow || typeof e.data !== 'string') return;
    var m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.event === 'init') {
      editorReady = true;
      setDot($('edDot'), true);
      postToEditor({ action: 'load', xml: currentXml });
    } else if (m.event === 'load') {
      requestExport(function (x) { currentXml = x; setSrc(x); channelSend({ type: 'xml', xml: x }); });
    } else if (m.event === 'export') {
      var x = m.data || m.xml || '';
      if (typeof x === 'string' && x.indexOf('data:') === 0) {
        try {
          var comma = x.indexOf(',');
          var meta = x.slice(0, comma);
          var payload = x.slice(comma + 1);
          if (meta.indexOf(';base64') >= 0) {
            // base64 数据（部分版本 format:xml 也回 base64）：按 UTF-8 还原
            var bin = atob(payload);
            var bytes = new Uint8Array(bin.length);
            for (var bi = 0; bi < bin.length; bi++) bytes[bi] = bin.charCodeAt(bi);
            x = new TextDecoder('utf-8').decode(bytes);
          } else {
            x = decodeURIComponent(payload);
          }
        } catch (err) {}
      }
      if (exportWaiter) { var cb = exportWaiter; exportWaiter = null; cb(x); }
    } else if (m.event === 'save') {
      if (m.xml) { currentXml = m.xml; channelSend({ type: 'xml', xml: m.xml }); }
      else requestExport(function (x) { currentXml = x; channelSend({ type: 'xml', xml: x }); });
      say('已从编辑器保存');
    } else if (m.event === 'autosave') {
      if (m.xml) { currentXml = m.xml; channelSend({ type: 'xml', xml: m.xml }); }
    }
  });

  // ---------- 按钮 ----------

  $('btnPull').onclick = function () {
    requestExport(function (x) { setSrc(x); channelSend({ type: 'xml', xml: x }); say('源码已更新'); });
  };
  $('btnPush').onclick = function () {
    var x = src.value;
    currentXml = x;
    postToEditor({ action: 'load', xml: x });
    channelSend({ type: 'xml', xml: x });
    say('已应用到编辑器');
  };
  $('btnCheck').onclick = async function () {
    try {
      var r = await fetch(BASE + '/api/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ xml: src.value }),
      });
      var j = await r.json();
      if (j.ok) say(j.warnings && j.warnings.length ? '校验通过，警告: ' + j.warnings.join('; ') : '校验通过', false);
      else say('编译错误: ' + (j.errors || []).join('；'), true);
    } catch (e) { say(String(e), true); }
  };

  (async function init() {
    try {
      var h = JSON.parse(localStorage.getItem('node.history') || '[]');
      h = h.filter(function (x) { return x.id !== nodeId; });
      h.unshift({ id: nodeId, title: '', at: new Date().toISOString() });
      localStorage.setItem('node.history', JSON.stringify(h.slice(0, 20)));
    } catch (e) {}
    try {
      var r = await fetch(BASE + '/api/nodes/' + encodeURIComponent(nodeId) + '/xml');
      if (r.ok) {
        var t = await r.text();
        if (t && t.trim()) currentXml = t;
      }
    } catch (e) {}
    // 拉取服务端通道配置（全局强制 ws/sse 时生效），随后建立通道
    try {
      var cfg = await (await fetch(BASE + '/api/config')).json();
      if (cfg && cfg.transport) applyTransport(cfg.transport);
    } catch (e) {}
    setSrc(currentXml);
    connect();
  })();
})();
</script>
</body>
</html>
