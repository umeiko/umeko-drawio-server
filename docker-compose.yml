name: umeko-drawio-server

services:
  drawio:
    image: jgraph/drawio:latest
    restart: unless-stopped
    environment:
      # webapp 的 /export 及 PDF 导出都转发到独立的导出服务
      EXPORT_URL: http://export-server:8000/
      # 注册自定义字体（方正兰亭黑）。镜像 entrypoint 会把该 JSON 写入 PreConfig.js；
      # fontUrl 为相对路径：浏览器经 server 代理访问时由 server 的 /fonts 直出，
      # 导出器的无头 Chrome 直连本容器时由下面的 webapp fonts 目录挂载提供
      DRAWIO_CONFIG: '{"customFonts":[{"fontFamily":"方正兰亭黑简体","fontUrl":"fonts/FZLanTingHeiS-R-GB.ttf"},{"fontFamily":"FZLanTingHeiS-R-GB","fontUrl":"fonts/FZLanTingHeiS-R-GB.ttf"}]}'
    volumes:
      # 字体文件需先执行 deploy/get-fonts.sh 下载（授权资产不入 git）
      - ./fonts:/usr/local/tomcat/webapps/draw/fonts:ro
    ports:
      # 调试用直达端口（生产访问走 server 的 3000 代理）
      - "127.0.0.1:8081:8080"
    networks: [drawnet]

  export-server:
    image: jgraph/export-server:latest
    restart: unless-stopped
    environment:
      # 关键：指向内网 webapp，否则默认去公网 viewer.diagrams.net 取导出页面
      DRAWIO_BASE_URL: http://drawio:8080
    expose:
      - "8000"
    volumes:
      # 向导出服务补充字体（如中文 Noto CJK）以获得正确的 PNG 渲染
      - ./fonts:/usr/share/fonts/drawio:ro
    depends_on:
      - drawio
    networks: [drawnet]

  svg-exporter:
    build: ./exporter
    restart: unless-stopped
    environment:
      PORT: "8001"
      DRAWIO_URL: http://drawio:8080
    expose:
      - "8001"
    volumes:
      # 字体目录（fontconfig 兜底，保证服务端渲染不缺字形）
      - ./fonts:/usr/share/fonts/drawio:ro
    depends_on:
      - drawio
    networks: [drawnet]

  server:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DRAWIO_URL: http://drawio:8080
      EXPORT_URLS: http://export-server:8000/,http://drawio:8080/export
      SVG_EXPORT_URLS: http://svg-exporter:8001/
      PUBLIC_BASE_URL: http://localhost:3000
      # ALB 等网关带路径前缀时显式指定完整对外地址，如 https://example.com/drawio（优先级高于 PUBLIC_BASE_URL）
      UMEKO_DRAWIO_SERVER_BASE_URL: "${UMEKO_DRAWIO_SERVER_BASE_URL:-}"
      NODE_HOT_MINUTES: "${NODE_HOT_MINUTES:-30}"
      NODE_COLD_HOURS: "${NODE_COLD_HOURS:-48}"
      SWEEP_INTERVAL_SECONDS: "${SWEEP_INTERVAL_SECONDS:-30}"
      # 节点页实时通道：auto(WS优先,失败自动降级SSE) / ws / sse（ALB 不支持 WebSocket 时设为 sse）
      NODE_TRANSPORT: "${NODE_TRANSPORT:-auto}"
      ADMIN_USER: "${ADMIN_USER:-umeko}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-1234}"
      # 编辑器静态直出（内网拉不到镜像时启用）：指向本机 drawio webapp 目录，设置后不再反代 drawio 容器
      DRAWIO_STATIC_DIR: "${DRAWIO_STATIC_DIR:-}"
      # 平台技能工具端点（可选）：ESM 模块路径，挂载到 /skills-mcp（可用 SKILLS_MCP_PATH 改路径）
      SKILLS_MCP_MODULE: "${SKILLS_MCP_MODULE:-}"
      SKILLS_MCP_PATH: "${SKILLS_MCP_PATH:-}"
      # AINA 平台 /widgets.json 声明（可选覆盖）：应用名/版本/widget id/白名单
      WIDGETS_APP: "${WIDGETS_APP:-}"
      WIDGETS_VERSION: "${WIDGETS_VERSION:-}"
      WIDGETS_ID: "${WIDGETS_ID:-}"
      # 追加协同业务 MCP 的工具名（逗号分隔，与默认白名单合并去重）
      WIDGETS_TOOLS_ALLOW_EXTRA: "${WIDGETS_TOOLS_ALLOW_EXTRA:-}"
      # 整体替换白名单（逃生门，逗号分隔）/ 整体替换 widgets.json 文件
      WIDGETS_TOOLS_ALLOW: "${WIDGETS_TOOLS_ALLOW:-}"
      WIDGETS_JSON_FILE: "${WIDGETS_JSON_FILE:-}"
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      # 自定义字体直出（/fonts，供经代理访问编辑器的浏览器加载 webfont）
      - ./fonts:/app/fonts:ro
    depends_on:
      - drawio
      - export-server
    networks: [drawnet]

networks:
  drawnet:
